[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pesquisafacil-dr3-tp3"
version = "1.0.0"
description = "Agente ReAct de pesquisa bibliográfica com LangChain, Gemini e memória."
requires-python = ">=3.12,<3.15"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-google-genai>=4.0,<5",
  "langgraph>=1.0,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["pesquisafacil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
